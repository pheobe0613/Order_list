<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>喊單明細表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style id="css">
/* Layout: header, then a tab bar switching between the per-buyer list and the product shelf; owner gets an edit mode with a sticky save bar */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#1E2433; --muted:#667085; --line:#E1E5EC;
  --accent:#2F5BD3; --accent-ink:#FFFFFF; --accent-soft:#E7EDFC; --slot:#EEF1F6; --danger:#C2342B; --danger-soft:#FCE9E7; --scrim:rgba(18,21,28,.72);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151C; --surface:#1B2029; --ink:#E8EBF2; --muted:#98A1B3; --line:#2B3240;
  --accent:#7D9BFF; --accent-ink:#0E1424; --accent-soft:#232C44; --slot:#232935; --danger:#FF8A80; --danger-soft:#3A2224; --scrim:rgba(0,0,0,.78); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151C; --surface:#1B2029; --ink:#E8EBF2; --muted:#98A1B3; --line:#2B3240;
  --accent:#7D9BFF; --accent-ink:#0E1424; --accent-soft:#232C44; --slot:#232935; --danger:#FF8A80; --danger-soft:#3A2224; --scrim:rgba(0,0,0,.78); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-block:28px 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:32px}
h1{font-size:clamp(1.6rem,4vw,2.1rem);font-weight:900;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-size:1.05rem;font-weight:700;margin:0;letter-spacing:.04em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.stats{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}
.stat small{display:block;color:var(--muted);font-size:.78rem;letter-spacing:.08em}
.stat b{font-family:var(--mono);font-size:1.4rem;font-weight:600}
.stat b.big{color:var(--accent)}
.sec-head{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.sec-head h2{flex:1}

button,.btn{font:inherit;font-size:.88rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
button:hover,.btn:hover{border-color:var(--accent)}
button:focus-visible,.btn:focus-within,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.danger{color:var(--danger)}
button.danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
button.small{padding:4px 8px;font-size:.8rem}
button:disabled{opacity:.55;cursor:default}
input,select{font:inherit;font-size:.9rem;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
.btn input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.btn{position:relative}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:-12px;overflow-x:auto}
.tab{border:0;border-radius:0;background:transparent;color:var(--muted);font-size:1rem;font-weight:700;padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{border-color:transparent;color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .c{font-family:var(--mono);font-size:.8rem;font-weight:500;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--slot);color:var(--muted)}
.tab[aria-selected="true"] .c{background:var(--accent-soft);color:var(--accent)}

/* product shelf */
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:600px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.prod .pic{aspect-ratio:1/1;max-width:100%}
.prod .info{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.prod .name{font-weight:700;font-size:.88rem;line-height:1.35;word-break:break-word}
.prod .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:0 6px;color:var(--muted);font-size:.78rem}
.prod .info input{font-size:.82rem;padding:5px 7px}
.prod .meta .q{color:var(--accent);font-weight:600}
.prod .info input{width:100%}
.prod .row{display:flex;gap:6px;flex-wrap:wrap}
.prod.new{border-style:dashed;background:transparent}
.prod.new .info{gap:8px}
.newpic{aspect-ratio:1/1;max-width:100%}

.pic{background:var(--slot);display:grid;place-items:center;color:var(--muted);font-size:.72rem;text-align:center;position:relative;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic svg{width:34%;height:34%;opacity:.45}

/* add order */
.addbox{background:var(--accent-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.addbox .fields{display:grid;grid-template-columns:1.2fr 1.6fr 80px auto;gap:8px;align-items:end}
.addbox label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);min-width:0}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.err{color:var(--danger);font-size:.85rem;margin:0}

/* buyers */
#q{width:min(220px,100%)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.buyer{display:grid;grid-template-columns:130px 1fr 96px;gap:14px;padding:14px 16px;border-top:1px solid var(--line);align-items:center}
.buyer:first-child{border-top:0}
.bname{font-weight:700;word-break:break-word;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.items{display:flex;flex-direction:column;gap:8px;min-width:0}
.it{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center}
.it .pic{width:48px;height:48px;border-radius:8px;font-size:0}
.it .pic svg{width:50%;height:50%}
.it .t{min-width:0}
.it .t div{font-size:.93rem}
.it .t span{color:var(--muted);font-size:.8rem}
.it .amt{font-size:.9rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.it .amt input{width:64px;text-align:center}
.total{text-align:right}
.total small{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.08em}
.total b{font-family:var(--mono);font-size:1.15rem;font-weight:600}
.empty{padding:24px;text-align:center;color:var(--muted)}
.foot{color:var(--muted);font-size:.8rem;margin:0}

/* zoomable thumbnails + lightbox */
.it .pic.zoom{padding:0;border:0;border-radius:8px;display:block;cursor:zoom-in}
.it .pic.zoom:hover{outline:2px solid var(--accent);outline-offset:1px}
.lb{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:center;justify-content:center;cursor:zoom-out;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb figure{margin:0;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:min(640px,100%)}
.lb img{max-width:100%;max-height:75vh;border-radius:12px;background:var(--surface);box-shadow:0 12px 40px rgba(0,0,0,.35);display:block}
.lb figcaption{background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.95rem}
.lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));border-radius:999px;width:40px;height:40px;justify-content:center;font-size:1.1rem;padding:0}

/* save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.savebar .in{max-width:980px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.savebar .msg{flex:1;min-width:0;font-size:.88rem}
.savebar .msg.bad{color:var(--danger)}

@media (max-width:640px){
  .buyer{grid-template-columns:1fr auto;grid-template-areas:"n t" "i i"}
  .bname{grid-area:n}.total{grid-area:t}.items{grid-area:i}
  .addbox .fields{grid-template-columns:1fr 80px}
  .addbox .fields .f-buyer,.addbox .fields .f-prod{grid-column:1 / -1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script id="app">

  h += '<section><div class="sec-head"><h2>商品一覽</h2></div><div class="shelf">';
  state.products.forEach(p => {
    const used = tally[p.id] || 0;
    if (E){
      const isArmed = armed === "p:" + p.id;
      h += '<div class="prod">' + pic(p, true) + '<div class="info">'
        + '<input id="pn-' + p.id + '" data-f="pname" data-id="' + p.id + '" value="' + esc(p.name) + '" aria-label="商品名稱">'
        + '<input id="pp-' + p.id + '" data-f="pprice" data-id="' + p.id + '" type="number" min="0" inputmode="numeric" value="' + p.price + '" aria-label="售價">'
        + '<div class="row"><label class="btn small"><input type="file" accept="image/*" data-f="pimg" data-id="' + p.id + '">' + (p.img ? '換照片' : '上傳照片') + '</label>'
        + '<button class="small danger' + (isArmed ? ' armed' : '') + '" data-a="delp" data-id="' + p.id + '">' + (isArmed ? (used ? '連同 ' + used + ' 件喊單刪除' : '確定刪除') : '刪除') + '</button></div>'
        + '</div></div>';
    } else {
      h += '<div class="prod">' + pic(p, true) + '<div class="info"><div class="name">' + esc(p.name) + '</div>'
        + '<div class="meta"><span class="num">$' + fmt(p.price) + '</span><span class="q num">共 ' + used + ' 件</span></div></div></div>';
    }
  });
  if (E){
    h += '<div class="prod new">' + (draftNew.img ? '<div class="pic newpic"><img src="' + esc(draftNew.img) + '" alt=""></div>' : '<div class="pic newpic">' + ph + '</div>')
      + '<div class="info"><input id="np-name" data-f="nname" placeholder="新商品名稱" value="' + esc(draftNew.name) + '">'
      + '<input id="np-price" data-f="nprice" type="number" min="0" inputmode="numeric" placeholder="售價" value="' + esc(draftNew.price) + '">'
      + '<div class="row"><label class="btn small"><input type="file" accept="image/*" data-f="nimg">照片</label>'
      + '<button class="small primary" data-a="addp">新增商品</button></div></div></div>';
  }
  h += '</div></section>';
  }
  if (tab === "orders"){
  // buyers
  h += '<section><div class="sec-head"><h2>每人喊單</h2><input id="q" type="search" placeholder="搜尋 Line 帳號" aria-label="搜尋 Line 帳號" value="' + esc(filter) + '"></div>';
  if (E){
    const buyers = state.orders.map(o => '<option value="' + esc(o.buyer) + '">').join("");
    h += '<div class="addbox"><div class="fields">'
      + '<label class="f-buyer">Line 帳號<input id="af-buyer" data-f="abuyer" list="buyerlist" placeholder="新名字或選既有的人" value="' + esc(addForm.buyer) + '"></label>'
      + '<datalist id="buyerlist">' + buyers + '</datalist>'
      + '<label class="f-prod">商品<select id="af-prod" data-f="aprod"><option value="">選擇商品</option>'
      + state.products.map(p => '<option value="' + p.id + '"' + (addForm.pid === p.id ? ' selected' : '') + '>' + esc(p.name) + '（$' + fmt(p.price) + '）</option>').join("") + '</select></label>'
      + '<label>數量<input id="af-qty" data-f="aqty" type="number" min="1" inputmode="numeric" value="' + esc(addForm.qty) + '"></label>'
      + '<button class="primary" data-a="addo">加入喊單</button></div>'
      + (addErr ? '<p class="err">' + esc(addErr) + '</p>' : '<p class="hint">輸入已有的帳號就會加在那個人的單裡，同商品會自動合併數量。</p>')
      + '</div>';
  }
  const f = filter.trim().toLowerCase();
  const rows = state.orders.filter(o => !f || o.buyer.toLowerCase().includes(f));
  h += '<div class="list">';
  if (!state.orders.length) h += '<div class="empty">還沒有任何喊單</div>';
  else if (!rows.length) h += '<div class="empty">找不到「' + esc(filter) + '」</div>';
  rows.forEach(o => {
    const sum = o.items.reduce((s, it) => s + lineTotal(it), 0);
    const isArmed = armed === "b:" + o.id;
    h += '<div class="buyer"><div class="bname">' + esc(o.buyer)
      + (E ? '<button class="small danger' + (isArmed ? ' armed' : '') + '" data-a="delb" data-id="' + o.id + '">' + (isArmed ? '確定刪除此人' : '刪除此人') + '</button>' : '')
      + '</div><div class="items">';
    o.items.forEach((it, i) => {
      const p = prod(it.pid); if (!p) return;
      h += '<div class="it">' + pic(p) + '<div class="t"><div>' + esc(p.name) + '</div><span class="num">$' + fmt(p.price) + (E ? '' : ' × ' + it.qty) + '</span></div>'
        + (E ? '<div class="amt"><input id="q-' + o.id + '-' + i + '" type="number" min="0" inputmode="numeric" data-f="qty" data-id="' + o.id + '" data-i="' + i + '" value="' + it.qty + '" aria-label="數量"><button class="small" data-a="deli" data-id="' + o.id + '" data-i="' + i + '" aria-label="移除這項">✕</button></div>'
             : '<div class="amt num">$' + fmt(lineTotal(it)) + '</div>')
        + '</div>';
    });
    h += '</div><div class="total"><small>總金額</small><b>$' + fmt(sum) + '</b></div></div>';
  });
  h += '</div></section>';
  }
  h += '<p class="foot">金額單位：新台幣（元）</p></div>';

  if (E){
    h += '<div class="savebar"><div class="in"><span class="msg' + (msgBad ? ' bad' : '') + '">'
      + esc(msg || (dirty ? '有未儲存的變更，儲存後對方才看得到。' : '編輯中，還沒有變更。')) + '</span>'
      + '<button data-a="discard"' + (busy ? ' disabled' : '') + '>' + (dirty ? '捨棄變更' : '結束編輯') + '</button>'
      + '<button class="primary" data-a="save"' + (!dirty || busy ? ' disabled' : '') + '>' + (busy ? '儲存中…' : '儲存') + '</button></div></div>';
  }
  const ae = document.activeElement, aid = ae && ae.id, sel = ae && ae.selectionStart;
  $("#root").innerHTML = h;
  if (aid){ const el = document.getElementById(aid); if (el){ el.focus(); try{ if (sel != null) el.setSelectionRange(sel, sel); }catch(e){} } }
}

function touch(){ dirty = true; msg = ""; msgBad = false; }

function compress(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const max = 640, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

function buildDoc(){
  const css = document.getElementById("css").textContent;
  const app = document.getElementById("app").textContent;
  const json = JSON.stringify(state).replace(/</g, "\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>'
    + HEAD + '<style id="css">' + css + '</style>\n<div id="root"></div>\n<script type="application/json" id="state">' + json + '<\/script>\n<script id="app">' + app + '<\/script></body></html>';
}

async function save(){
  if (!artifactNs){ msg = "這裡無法儲存，請在 Claude 裡開啟此頁面。"; msgBad = true; render(); return; }
  busy = true; msg = ""; render();
  try {
    await artifactNs.publish(buildDoc());
    dirty = false; msg = "已儲存，正在載入新版本…"; msgBad = false;
  } catch (e) {
    const c = e && e.code; msgBad = true;
    if (c === "conflict") msg = "頁面剛被更新過，正在載入最新版本，這次的變更沒有存到。";
    else if (c === "not_writer" || c === "not_granted" || c === "consent_required" || c === "capability_disabled") { msg = "你只有檢視權限，無法儲存。"; canEdit = false; }
    else if (c === "too_large") msg = "頁面太大了，請刪掉一些照片或換小一點的照片。";
    else if (c === "rate_limited") msg = "儲存太頻繁，請稍等一下再按儲存。";
    else msg = "儲存失敗，請再按一次儲存。";
  }
  busy = false; render();
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id, i = +b.dataset.i;
  if (a !== "delp" && a !== "delb") armed = null;
  if (a === "zoom"){ openLb(b.dataset.pid, b); return; }
  if (a === "tab"){ tab = b.dataset.tab; try{ location.hash = tab; }catch(err){} }
  else if (a === "edit"){ editing = true; }
  else if (a === "discard"){ state = JSON.parse(JSON.stringify(saved)); dirty = false; editing = false; msg = ""; addErr = ""; }
  else if (a === "save"){ save(); return; }
  else if (a === "delp"){
    if (armed === "p:" + id){ state.products = state.products.filter(p => p.id !== id);
      state.orders.forEach(o => o.items = o.items.filter(it => it.pid !== id)); state.orders = state.orders.filter(o => o.items.length); armed = null; touch(); }
    else armed = "p:" + id;
  }
  else if (a === "delb"){
    if (armed === "b:" + id){ state.orders = state.orders.filter(o => o.id !== id); armed = null; touch(); }
    else armed = "b:" + id;
  }
  else if (a === "deli"){
    const o = state.orders.find(o => o.id === id); o.items.splice(i, 1);
    if (!o.items.length) state.orders = state.orders.filter(x => x !== o); touch();
  }
  else if (a === "addp"){
    const name = draftNew.name.trim(), price = Number(draftNew.price);
    if (!name || !(price >= 0) || draftNew.price === ""){ msg = "新商品需要名稱和售價。"; msgBad = true; render(); return; }
    state.products.push({id: uid("p"), name, price, img: draftNew.img}); draftNew = {name:"", price:"", img:""}; touch();
  }
  else if (a === "addo"){
    const buyer = addForm.buyer.trim(), qty = parseInt(addForm.qty, 10);
    if (!buyer){ addErr = "請填 Line 帳號。"; render(); return; }
    if (!addForm.pid){ addErr = "請選擇商品。"; render(); return; }
    if (!(qty > 0)){ addErr = "數量至少 1。"; render(); return; }
    let o = state.orders.find(o => o.buyer.trim().toLowerCase() === buyer.toLowerCase());
    if (!o){ o = {id: uid("b"), buyer, items: []}; state.orders.push(o); }
    const it = o.items.find(it => it.pid === addForm.pid);
    if (it) it.qty += qty; else o.items.push({pid: addForm.pid, qty});
    addErr = ""; addForm = {buyer:"", pid: addForm.pid, qty:1}; touch();
  }
  render();
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q"){ filter = t.value; render(); return; }
  const f = t.dataset.f;
  if (f === "nname") draftNew.name = t.value;
  else if (f === "nprice") draftNew.price = t.value;
  else if (f === "abuyer") addForm.buyer = t.value;
  else if (f === "aqty") addForm.qty = t.value;
});

document.addEventListener("change", async e => {
  const t = e.target, f = t.dataset.f, id = t.dataset.id;
  if (f === "aprod"){ addForm.pid = t.value; return; }
  if (f === "pname"){ const p = prod(id); const v = t.value.trim(); if (v && v !== p.name){ p.name = v; touch(); } render(); }
  else if (f === "pprice"){ const p = prod(id); const v = Number(t.value); if (t.value !== "" && v >= 0 && v !== p.price){ p.price = v; touch(); } render(); }
  else if (f === "qty"){
    const o = state.orders.find(o => o.id === id), i = +t.dataset.i, v = parseInt(t.value, 10);
    if (v > 0){ if (v !== o.items[i].qty){ o.items[i].qty = v; touch(); } }
    else if (t.value !== ""){ o.items.splice(i, 1); if (!o.items.length) state.orders = state.orders.filter(x => x !== o); touch(); }
    render();
  }
  else if ((f === "pimg" || f === "nimg") && t.files && t.files[0]){
    try {
      const data = await compress(t.files[0]);
      if (f === "pimg"){ prod(id).img = data; touch(); } else draftNew.img = data;
    } catch(err){ msg = "這張照片讀不出來，請換一張 JPG 或 PNG。"; msgBad = true; }
    render();
  }
});

let lbEl = null, lbReturn = null;
function closeLb(){ if (!lbEl) return; lbEl.remove(); lbEl = null; if (lbReturn && document.body.contains(lbReturn)) lbReturn.focus(); }
function openLb(pid, from){
  const p = prod(pid); if (!p || !p.img) return;
  closeLb(); lbReturn = from;
  lbEl = document.createElement("div"); lbEl.className = "lb"; lbEl.setAttribute("role", "dialog"); lbEl.setAttribute("aria-modal", "true"); lbEl.setAttribute("aria-label", p.name);
  lbEl.innerHTML = '<button class="x" aria-label="關閉">✕</button><figure><img src="' + esc(p.img) + '" alt="' + esc(p.name) + '"><figcaption>' + esc(p.name) + '　$' + fmt(p.price) + '</figcaption></figure>';
  lbEl.addEventListener("click", e => { e.stopPropagation(); closeLb(); });
  document.body.appendChild(lbEl); lbEl.querySelector(".x").focus();
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLb(); });

window.addEventListener("hashchange", () => { const t = location.hash === "#products" ? "products" : "orders"; if (t !== tab){ tab = t; render(); } });

window.addEventListener("beforeunload", e => { if (dirty && !busy){ e.preventDefault(); e.returnValue = ""; } });

render();

(async () => {
  if (!window.claude || !window.claude.use) return;
  try {
    const [art, user] = await Promise.all([window.claude.use("artifact"), window.claude.use("user")]);
    artifactNs = art;
    const ok = user ? await user.canEdit() : false;
    if (art && ok){ canEdit = true; render(); }
  } catch(e){}
})();
})();
</script></body></html>
